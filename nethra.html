<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dream World</title>

    <link rel="stylesheet" href="./shra.css">
</head>

<body>

    <header>

        <h1>MY DREAM WORLD</h1>

        <div class="searchbox">
            <input type="text" placeholder="Search my world...">
            <button>Search</button>
        </div>

    </header>

    <aside class="sidebar">

        <h2>My Menu</h2>

        <nav>
            <ul>
                <li><a href="#home">My Home</a></li>
                <li><a href="#favorites">My Favorites</a></li>
                <li><a href="#food">My Food</a></li>
            </ul>
        </nav>

    </aside>

    <main>

        <section class="welcome" id="home">

            <h2>Welcome to My Dream World</h2>

            <p>
                Welcome to my little world!
                Here you can explore my favorite things,
                dreams, food and hobbies.
                These are the little things that make me happy.
            </p>

            <button>Enter My World</button>

        </section>

        <section class="popular" id="favorites">

            <h2>Explore My World</h2>

            <div class="content-container"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 MY DREAM WORLD. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="demo.js"></script>
    <script type="module" src="nethzz.js"></script>
    <script src="demo.js" defer></script>

</body>
</html>
